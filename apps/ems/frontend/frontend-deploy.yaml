apiVersion: apps/v1
kind: Deployment
metadata:
  name: ems-frontend
  namespace: ems

spec:
  replicas: 2
  selector:
    matchLabels:
      app: ems-frontend

  template:
    metadata:
      labels:
        app: ems-frontend

    spec:
      containers:
        - name: ems-frontend
          image: 015911059278.dkr.ecr.us-west-2.amazonaws.com/ems-frontend:v1.0.0

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: 100m
              memory: 64Mi

            limits:
              cpu: 250m
              memory: 128Mi

