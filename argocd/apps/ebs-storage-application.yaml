apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ebs-storage
  namespace: argocd

spec:
  project: gitops

  source:
    repoURL: https://github.com/sunilchouhan07/GitOps-Practice.git
    targetRevision: main
    path: platform/storage

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
