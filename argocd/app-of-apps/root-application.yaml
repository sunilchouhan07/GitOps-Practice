apiVersion: argoproj.io/v1alpha1
kind: Application 
metadata:
  name: root-app
  namespace: argocd

spec:
  project: GitOps-Project
  source:
    repoURL: https://github.com/sunilchouhan07/GitOps-Practice.git
    targetRevision: main
    path: argocd/apps

    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

      

