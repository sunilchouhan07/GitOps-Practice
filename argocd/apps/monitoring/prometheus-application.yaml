apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd

spec:
  project: gitops

  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus
    targetRevision: 27.37.0

    helm:
      values: |
        server:
          persistentVolume:
            enabled: true
            storageClass: ebs-gp3
            size: 8Gi
        
        alertmanager:
          enabled: true

          persistentVolume:
            enabled: true
            storageClass: ebs-gp3
            size: 2Gi

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true

